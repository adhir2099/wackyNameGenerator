<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Spin a slot machine to generate wacky, pronounceable names from 3 to 9 letters.">
<meta name="theme-color" content="#0b1d5e">
<title>Wacky Name Generator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<main class="stage">
  <div class="machine-wrap">
    <section class="machine" aria-label="Name slot machine">

      <header class="marquee" id="marquee">
        <h1>Wacky Name Generator</h1>
      </header>

      <div class="window">
        <div class="reels" id="reels" aria-hidden="true"></div>
        <div class="holds" id="holds" role="group" aria-label="Hold letters"></div>
      </div>

      <div class="deck">
        <fieldset class="length-picker" id="lengthPicker">
          <legend>Letters</legend>
          <div class="length-options" id="lengthOptions"></div>
        </fieldset>

        <button class="spin-btn" id="spinBtn" type="button">
          <span class="spin-label" id="spinLabel">Spin</span>
        </button>
      </div>

      <div class="ticket-slot" aria-hidden="true"></div>

      <!-- Side lever -->
      <button class="lever" id="lever" type="button" aria-label="Pull the lever to spin">
        <span class="lever-arm">
          <span class="lever-ball"></span>
          <span class="lever-shaft"></span>
        </span>
        <span class="lever-mount"></span>
      </button>
    </section>

    <!-- Printed result -->
    <div class="ticket-tray">
      <div class="ticket" id="ticket" hidden>
        <p class="ticket-name" id="ticketName"></p>
        <div class="ticket-actions">
          <button type="button" class="ticket-btn" id="copyBtn">Copy</button>
          <button type="button" class="ticket-btn" id="saveBtn">Save</button>
        </div>
      </div>
    </div>

    <p class="tip" id="tip"><span class="kbd-tip">Press <kbd>Space</kbd> to spin. </span>Tap <b>Hold</b> under a letter to keep it on the next spin.</p>
  </div>

  <section class="saved" aria-labelledby="savedTitle">
    <div class="saved-head">
      <h2 id="savedTitle">Saved names <span class="saved-count" id="savedCount"></span></h2>
      <button type="button" class="link-btn" id="clearBtn" hidden>Clear all</button>
    </div>
    <ul class="saved-list" id="savedList"></ul>
    <p class="saved-empty" id="savedEmpty">Names you save show up here. Click one to copy it.</p>
  </section>
</main>

<div class="sr-only" aria-live="polite" id="announcer"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/main.js"></script>
</body>
</html>
